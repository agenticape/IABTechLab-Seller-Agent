# Buyer demo web UI on Fly.io -> https://iab-buyer.agenticape.ai
# Deploy from examples/buyer-demo (see DEPLOY.md):
#   fly deploy . --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile --ha=false
#
# Secrets (never in this file): SELLER_URL, SELLER_API_KEY, SELLER_API_KEY_AGENCY,
# SELLER_API_KEY_SEAT, and optionally DEMO_UI_PASSWORD.

app = "iab-buyer-agenticape"
primary_region = "syd"

[env]
  PORT = "8080"
  # Guardrails. Run queue and rate limit live in memory on the one machine.
  DEMO_RATE_LIMIT_RUNS = "3"
  DEMO_RATE_LIMIT_WINDOW_SECONDS = "600"
  DEMO_MAX_CONCURRENT_RUNS = "1"
  DEMO_MAX_QUEUED_RUNS = "10"
  DEMO_LIVE_FEED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    # Each viewer holds one Server-Sent Events connection while watching.
    type = "connections"
    soft_limit = 50
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
