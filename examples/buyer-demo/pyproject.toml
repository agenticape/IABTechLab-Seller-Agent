[project]
name = "buyer-agent-demo"
version = "0.1.0"
description = "Standalone buyer demo that calls a live AAMP seller over REST"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # Windows Python has no IANA zone database; the logs use Australia/Sydney.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
